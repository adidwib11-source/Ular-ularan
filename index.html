
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ular</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <h1>🐍 Game Ular</h1>

        <div class="score-board">
            <span>Skor: <strong id="score">0</strong></span>
            <span>Rekor: <strong id="best-score">0</strong></span>
        </div>

        <div class="game-screen">
            <canvas id="game-canvas" width="360" height="360"></canvas>

            <div id="game-overlay" class="game-overlay">
                <h2 id="game-message">Siap Bermain?</h2>
                <button id="start-button">Mulai Game</button>
            </div>
        </div>

        <section class="controller-section">
            <p class="controller-label">CONTROLS</p>

            <div class="joystick">
                <button class="direction up" data-direction="up" aria-label="Atas">
                    <span>▲</span>
                </button>

                <button class="direction left" data-direction="left" aria-label="Kiri">
                    <span>◀</span>
                </button>

                <div class="joystick-center">
                    <div></div>
                </div>

                <button class="direction right" data-direction="right" aria-label="Kanan">
                    <span>▶</span>
                </button>

                <button class="direction down" data-direction="down" aria-label="Bawah">
                    <span>▼</span>
                </button>
            </div>

            <p class="hint">Gunakan tombol arah untuk bergerak</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
